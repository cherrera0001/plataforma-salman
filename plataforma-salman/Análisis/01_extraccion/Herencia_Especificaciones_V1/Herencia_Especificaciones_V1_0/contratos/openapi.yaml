                format: uuid
              minItems: 0
              maxItems: 500
            bands:
              type: array
              items:
                $ref: '#/components/schemas/NestedCancellationBand'
              minItems: 0
              maxItems: 500
          required: []
      required:
      - kind
      - version
      - effective_from
      - approved_by
      - parameters
