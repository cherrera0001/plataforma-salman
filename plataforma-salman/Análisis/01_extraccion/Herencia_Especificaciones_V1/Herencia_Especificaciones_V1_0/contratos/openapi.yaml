components:
  schemas:
    Money:
      type: object
      additionalProperties: false
      properties:
        amount_minor:
          type: integer
        currency:
          type: string
          pattern: ^[A-Z]{3}$
      required:
      - amount_minor
      - currency
      description: Entero en unidad menor. CLP usa unidad peso; cada moneda declara escala. Signo permitido sólo en ajustes
        y movimientos firmados.
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        correlation_id:
          type: string
          format: uuid
        retryable:
          type: boolean
        field_errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              reason:
                type: string
            required:
            - field
            - reason
          minItems: 0
          maxItems: 500
      required:
      - code
      - message
      - correlation_id
      - retryable
      - field_errors
    ResourceResult:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        status:
          type: string
        correlation_id:
          type: string
          format: uuid
        event_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 0
          maxItems: 500
      required:
      - id
      - version
      - status
      - correlation_id
      - event_ids
      description: Acuse de comando; no implica aprobación de proveedor ni abono bancario. Leer recurso autorizado para detalle.
    Page:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResourceSummary'
          minItems: 0
          maxItems: 500
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - items
      - next_cursor
    ResourceSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        status:
          type: string
        version:
          type: integer
          minimum: 1
      required:
      - id
      - label
      - status
      - version
      description: Proyeccion mínima; campos sensibles sólo en endpoint de detalle con permiso.
    PartyInput:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
        email:
          type: string
          format: email
        phone_e164:
          type: string
        kind:
          type: string
          enum:
          - PERSON
          - COMPANY
      required:
      - display_name
      - kind
    Occupancy:
      type: object
      additionalProperties: false
      properties:
        adults:
          type: integer
          minimum: 1
          maximum: 10
        children_ages:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 17
          minItems: 0
          maxItems: 10
      required:
      - adults
      - children_ages
    StaySearch:
      type: object
      additionalProperties: false
      properties:
        arrival:
          type: string
          format: date
        departure:
          type: string
          format: date
        occupancy:
          $ref: '#/components/schemas/Occupancy'
        rooms:
          type: integer
          minimum: 1
          maximum: 17
      required:
      - arrival
      - departure
      - occupancy
      - rooms
      description: Noches [arrival,departure). Fechas locales del hotel; mayores rangos requieren canal grupos. Nunca aceptar
        cantidad negativa.
    AvailabilityOffer:
      type: object
      additionalProperties: false
      properties:
        room_type_id:
          type: string
          format: uuid
        rate_plan_id:
          type: string
          format: uuid
        remaining:
          type: integer
          minimum: 0
        price_from:
          $ref: '#/components/schemas/Money'
        restrictions:
          type: array
          items:
            type: string
          minItems: 0
          maxItems: 500
      required:
      - room_type_id
      - rate_plan_id
      - remaining
      - price_from
      - restrictions
    AvailabilityResult:
      type: object
      additionalProperties: false
      properties:
        searched_at:
          type: string
          format: date-time
        offers:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityOffer'
          minItems: 0
          maxItems: 500
        timezone:
          type: string
      required:
      - searched_at
      - offers
      - timezone
      description: Consulta no retiene cupo. Revalidar al cotizar/retener/confirmar.
    Origin:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
        medium:
          type: string
        campaign:
          type: string
        link_id:
          type: string
        tracking_allowed:
          type: boolean
      required:
      - tracking_allowed
    QuoteRequest:
      type: object
      additionalProperties: false
      properties:
        stay:
          $ref: '#/components/schemas/StaySearch'
        room_type_id:
          type: string
          format: uuid
        rate_plan_id:
          type: string
          format: uuid
        promotion_code:
          type: string
        origin:
          $ref: '#/components/schemas/Origin'
      required:
      - stay
      - room_type_id
      - rate_plan_id
    PriceNight:
      type: object
      additionalProperties: false
      properties:
        night:
          type: string
          format: date
        base:
          $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        rule_version:
          type: string
      required:
      - night
      - base
      - discount
      - tax
      - total
      - rule_version
    CancellationBand:
      type: object
      additionalProperties: false
      properties:
        before_arrival_hours:
          type: integer
          minimum: 0
        charge_kind:
          type: string
          enum:
          - NONE
          - FIXED
          - PERCENT
          - FIRST_NIGHT
        charge_value:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
      required:
      - before_arrival_hours
      - charge_kind
      - charge_value
    PolicySnapshot:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
        cancellation_bands:
          type: array
          items:
            $ref: '#/components/schemas/CancellationBand'
          minItems: 1
          maxItems: 500
        deposit_kind:
          type: string
          enum:
          - NONE
          - FIXED
          - PERCENT
        deposit_value:
          type: string
        payment_due:
          type: string
          enum:
          - BEFORE_ARRIVAL
          - AT_CHECKIN
          - AT_CHECKOUT
          - CORPORATE_TERM
        checkin_local:
          type: string
        checkout_local:
          type: string
        breakfast_included:
          type: boolean
        terms_document_id:
          type: string
          format: uuid
        tax_rule_version:
          type: string
      required:
      - version
      - cancellation_bands
      - deposit_kind
      - deposit_value
      - payment_due
      - checkin_local
      - checkout_local
      - breakfast_included
      - terms_document_id
      - tax_rule_version
    QuoteResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        expires_at:
          type: string
          format: date-time
        nights:
          type: array
          items:
            $ref: '#/components/schemas/PriceNight'
          minItems: 1
          maxItems: 500
        total:
          $ref: '#/components/schemas/Money'
        deposit_due:
          $ref: '#/components/schemas/Money'
        policy:
          $ref: '#/components/schemas/PolicySnapshot'
        quote_token:
          type: string
      required:
      - id
      - version
      - expires_at
      - nights
      - total
      - deposit_due
      - policy
      - quote_token
      description: Token opaco; sólo cliente autorizado. No registrar token en logs. La oferta no equivale a confirmacion.
    HoldRequest:
      type: object
      additionalProperties: false
      properties:
        quote_token:
          type: string
      required:
      - quote_token
    HoldResponse:
      type: object
      additionalProperties: false
      properties:
        hold_token:
          type: string
        expires_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ACTIVE
      required:
      - hold_token
      - expires_at
      - status
    ReservationRequest:
      type: object
      additionalProperties: false
      properties:
        quote_token:
          type: string
        hold_token:
          type: string
        booker:
          $ref: '#/components/schemas/PartyInput'
        terms_version:
          type: string
        terms_accepted:
          type: boolean
          const: true
        marketing_opt_in:
          type: boolean
      required:
      - quote_token
      - booker
      - terms_version
      - terms_accepted
    ReservationPublic:
      type: object
      additionalProperties: false
      properties:
        reference:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - CANCELLED
          - CONFLICT
        total:
          $ref: '#/components/schemas/Money'
        paid:
          $ref: '#/components/schemas/Money'
        balance:
          $ref: '#/components/schemas/Money'
        arrival:
          type: string
          format: date
        departure:
          type: string
          format: date
        manage_token:
          type: string
      required:
