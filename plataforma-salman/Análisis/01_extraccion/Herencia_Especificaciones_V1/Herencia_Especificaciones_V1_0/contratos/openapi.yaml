  securitySchemes:
    SessionAuth:
      type: http
      scheme: bearer
      description: 'JWT OIDC validado: issuer,audience,exp; sesion revocable. Cliente web usa BFF y cookie HttpOnly con CSRF,
        no token en localStorage.'
    PortalCapability:
      type: http
      scheme: bearer
      description: Token limitado a una reserva y acciones; hash almacenado, expira y revocable.
    PublicCapability:
      type: http
      scheme: bearer
      description: Token limitado al intento propio.
    ProviderSignature:
      type: apiKey
      in: header
      name: X-Integration-Verification
      description: Contrato interno del gateway. El adaptador verifica firma/cabeceras originales reales, timestamp y replay;
        esta cabecera sola no prueba origen externo.
